<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="常用数据产品组件、动画演示、操作 Demo 与 AI 指令速查">
  <title>数据产品组件手册</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#top"><span>DP</span>数据产品组件手册</a>
    <a class="top-link" href="#prompt">AI 指令公式</a>
  </header>

  <main id="top">
    <section class="guide" id="guide">
      <aside class="sidebar">
        <div class="sidebar-head"><p class="eyebrow">DIRECTORY</p><h2>组件目录</h2></div>
        <nav class="category-nav" id="category-nav" aria-label="组件分类"></nav>
      </aside>

      <div class="content">
        <div class="content-head"><p class="eyebrow" id="section-kicker">SELECT</p><h2 id="section-title">选择输入</h2><p id="section-hint">从选项中做选择</p></div>
        <article class="detail" id="detail" aria-live="polite"></article>

      <div class="formula"><span>组件</span><i>+</i><span>触发</span><i>+</i><span>位置</span><i>+</i><span>结果</span></div>

    </section>
  </main>

  <footer>数据产品组件手册 · 让交互需求更容易理解和表达</footer>
  <div class="toast" id="toast" role="status">已复制</div>
