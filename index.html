<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="常用数据产品组件、动画演示、操作 Demo 与 AI 指令速查">
  <title>数据产品组件手册</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#top"><span>DP</span>数据产品组件手册</a>
    <div class="top-actions"><span class="library-count" id="library-count">78 个模式</span><button class="search-trigger" id="search-trigger" type="button"><span>⌕</span>搜索组件 <kbd>⌘ K</kbd></button><a class="top-link" href="#prompt">AI 指令公式</a></div>
  </header>

  <main id="top">
    <section class="guide" id="guide">
      <aside class="sidebar">
        <div class="sidebar-head"><p class="eyebrow">DIRECTORY</p><h2>组件目录</h2><p>按类型展开，或直接按任务查找</p></div>
        <div class="task-shortcuts" aria-label="按任务查找"><button data-task="选择">选择</button><button data-task="筛选">筛选</button><button data-task="比较">比较</button><button data-task="详情">看详情</button><button data-task="状态">看状态</button><button data-task="布局">搭看板</button><button data-task="收藏">★ 收藏</button><button data-task="最近">最近看过</button></div>
        <nav class="category-nav" id="category-nav" aria-label="组件分类"></nav>
      </aside>

      <div class="content">
        <div class="content-head"><p class="eyebrow" id="section-kicker">SELECT</p><h2 id="section-title">选择输入</h2><p id="section-hint">从选项中做选择</p></div>
        <article class="detail" id="detail" aria-live="polite"></article>
      </div>
    </section>

    <section class="prompt-section" id="prompt">
      <div><p class="eyebrow">ONE SENTENCE FORMULA</p><h2>一条好指令，只需四件事</h2><p class="muted">组件是什么、用户怎么触发、它出现在哪里、操作后发生什么。</p></div>
      <div class="formula"><span>组件</span><i>+</i><span>触发</span><i>+</i><span>位置</span><i>+</i><span>结果</span></div>
      <div class="example"><b>例</b><p>做一个右侧抽屉。点击“查看详情”时从页面右侧滑入，宽 360px；关闭后回到原页面位置。</p><button type="button" data-copy="做一个右侧抽屉。点击“查看详情”时从页面右侧滑入，宽 360px；关闭后回到原页面位置。">复制</button></div>
    </section>
  </main>

  <footer>数据产品组件手册 · 让交互需求更容易理解和表达</footer>
  <div class="toast" id="toast" role="status">已复制</div>
  <div class="search-dialog" id="search-dialog" hidden>
    <div class="search-panel" role="dialog" aria-modal="true" aria-label="搜索组件">
      <label><span>⌕</span><input id="global-search" placeholder="搜索组件、场景或英文名" autocomplete="off"><kbd>Esc</kbd></label>
      <div class="search-results" id="search-results"></div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
